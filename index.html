<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Display Informasi</title>
<style>
:root{color-scheme:dark;--bg:#06402b;--card:#0b5a3c;--ac:#f5c542;--tx:#fffbe8;--mu:#d6e8a8}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg) center/cover no-repeat;color:var(--tx);font-family:system-ui,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:2.5vh 4vw 0}
#place{font-size:2.2vh;color:var(--mu)}
#gear{background:none;border:0;color:var(--mu);font-size:3vh;cursor:pointer;opacity:.5}
main{flex:1;min-height:0;display:flex;padding:1.5vh 4vw}
#info{flex:1;background:#05301fbb;border-radius:2vh;overflow:hidden;display:flex;align-items:center;justify-content:center;border:.3vh solid #f5c54266}
#slide{width:100%;height:100%;object-fit:contain;display:none}
#empty{color:var(--mu);font-size:3vh;text-align:center;padding:0 4vw}
#tm{text-align:right}
#clock{color:var(--ac)}
#clock{font-size:8vh;font-weight:700;letter-spacing:.02em;line-height:1;font-variant-numeric:tabular-nums}
#date{font-size:2.2vh;color:var(--mu);margin-top:.5vh}
#next{font-size:3vh;padding:0 4vw 1vh;color:var(--ac);text-align:center}
#cards{display:grid;grid-template-columns:repeat(6,1fr);gap:1.4vw;padding:0 4vw 2vh}
.c{background:var(--card);border-radius:2vh;padding:2.4vh 1vw;text-align:center;border:.4vh solid #f5c54233}
.c.on{border-color:var(--ac);background:#178a58;box-shadow:0 0 3vh #f5c54266}
.c b{display:block;font-size:2.6vh;color:var(--mu);font-weight:600}
.c span{font-size:6vh;font-weight:700;font-variant-numeric:tabular-nums}
.c.on b{color:var(--ac)}
footer{background:#f5c542;color:#053823;font-weight:600;padding:1.6vh 0;overflow:hidden;white-space:nowrap}
#tick{display:inline-block;padding-left:100%;font-size:3vh;animation:s 40s linear infinite}
@keyframes s{to{transform:translateX(-100%)}}
#adz{position:fixed;inset:0;background:radial-gradient(circle,#0f7a4d,#032a1b);display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;z-index:9}
#adz.show{display:flex}
#adz h1{font-size:14vh;margin:0;color:var(--ac)}
#adz p{font-size:4vh;margin:2vh 0 0}
#unlock{position:fixed;top:1.5vh;left:50%;transform:translateX(-50%);background:var(--ac);color:#222;border:0;border-radius:99px;padding:1vh 2vw;font-size:2.2vh;font-weight:600;cursor:pointer;z-index:10}
#set{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:11}
#set.show{display:flex}
#set div{max-height:94vh;overflow:auto;background:var(--card);padding:3vh 3vw;border-radius:2vh;width:min(560px,92vw);display:grid;gap:1.2vh;font-size:2vh}
#set input,#set textarea,#set button{font:inherit;padding:.8vh 1vw;border-radius:1vh;border:1px solid var(--mu);background:var(--bg);color:var(--tx)}
#set button{cursor:pointer;background:var(--ac);color:#222;border:0;font-weight:600}
#set .g{display:grid;grid-template-columns:1fr 1fr;gap:1vw}
</style>
</head>
<body>
<button id="unlock">🔊 Klik sekali untuk mengaktifkan suara adzan</button>
<header><div style="display:flex;align-items:center;gap:1.5vw"><img id="logo" alt="" style="display:none;height:10vh"><div id="place"></div></div><div style="display:flex;align-items:center;gap:1.5vw"><div id="tm"><div id="clock">--:--:--</div><div id="date"></div></div><button id="gear" title="Pengaturan (tombol S)">⚙</button></div></header>
<main>
  <div id="info"><img id="slide" alt=""><div id="empty">Belum ada informasi. Unggah gambar di pengaturan (ikon ⚙ atau tombol S).</div></div>
  
  
</main>
<div id="next"></div><section id="cards"></section>
<footer><div id="tick"></div></footer>

<div id="adz" onclick="stopAdzan()"><h1 id="adzN"></h1><p>Waktunya sholat. Mari tinggalkan aktivitas sejenak.</p></div>

<div id="set"><div>
  <b>Pengaturan</b>
  <label>Nama lokasi<input id="sName"></label>
  <div class="g"><label>Lintang (lat)<input id="sLat" type="number" step="any"></label>
  <label>Bujur (lng)<input id="sLng" type="number" step="any"></label></div>
  <label>Koreksi menit: Subuh, Terbit, Dzuhur, Ashar, Maghrib, Isya<input id="sOff"></label>
  <label>Teks berjalan<textarea id="sTxt" rows="3"></textarea></label>
  <label>Gambar informasi / poster (boleh pilih banyak)<input id="sInfo" type="file" accept="image/*" multiple></label>
  <button id="sClr" type="button">Hapus semua gambar informasi</button>
  <label>Logo UIN (gambar PNG/JPG)<input id="sLogo" type="file" accept="image/*"></label>
  <label>Background gedung UIN (gambar)<input id="sBg" type="file" accept="image/*"></label>
  <label>File suara adzan (mp3/wav, tersimpan di browser ini)<input id="sAud" type="file" accept="audio/*"></label>
  <div class="g"><button id="sTest">Tes adzan</button><button id="sSave">Simpan</button></div>
</div></div>

<audio id="aud"></audio>
<script>
const $=id=>document.getElementById(id);
const NAMES=[["fajr","Subuh"],["dhuhr","Dzuhur"],["asr","Ashar"],["maghrib","Maghrib"],["isha","Isya"]];
const SHOW=[["fajr","Subuh"],["sunrise","Terbit"],["dhuhr","Dzuhur"],["asr","Ashar"],["maghrib","Maghrib"],["isha","Isya"]];
const DEF={off:{fajr:3,sunrise:3,dhuhr:4,asr:3,maghrib:4,isha:4},name:"Pekanbaru",lat:0.5071,lng:101.4478,txt:"Selamat datang. Jagalah kebersihan dan ketertiban bersama. Luruskan shaf, matikan HP saat sholat berjamaah."};
let cfg={...DEF};
try{Object.assign(cfg,JSON.parse(localStorage.getItem("tvcfg")||"{}"))}catch(e){}

/* ---- hitung waktu sholat (Kemenag RI) ---- */
const R=Math.PI/180,sin=x=>Math.sin(x*R),cos=x=>Math.cos(x*R),tan=x=>Math.tan(x*R);
const asin=x=>Math.asin(x)/R,acos=x=>Math.acos(x)/R,atan2=(y,x)=>Math.atan2(y,x)/R;
const fix=(a,m)=>((a%m)+m)%m;
function calc(d){
  const tz=-d.getTimezoneOffset()/60,{lat,lng}=cfg;
  const jd=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5+2440587.5+.5-tz/24;
  const D=jd-2451545,g=fix(357.529+.98560028*D,360),q=fix(280.459+.98564736*D,360);
  const L=fix(q+1.915*sin(g)+.02*sin(2*g),360),e=23.439-4e-7*D;
  const ra=fix(atan2(cos(e)*sin(L),cos(L)),360)/15,eqt=q/15-ra;
  const dec=asin(sin(e)*sin(L));
  const noon=fix(12-eqt,24)+tz-lng/15;
  const t=a=>acos((-sin(a)-sin(dec)*sin(lat))/(cos(dec)*cos(lat)))/15;
  const asrA=Math.atan(1/(1+tan(Math.abs(lat-dec))))/R;
  const asr=acos((sin(asrA)-sin(lat)*sin(dec))/(cos(lat)*cos(dec)))/15;
  const base=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  const O=cfg.off,T=(h,o)=>new Date(base+Math.round(h*60+o)*6e4);
  return{fajr:T(noon-t(20),O.fajr),sunrise:T(noon-t(.833),O.sunrise),dhuhr:T(noon,O.dhuhr),asr:T(noon+asr,O.asr),maghrib:T(noon+t(.833),O.maghrib),isha:T(noon+t(18),O.isha)};
}

/* ---- audio ---- */
let ctx,unlocked=false,customURL=null;
const A=$("aud");
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open("tv",1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>ok(r.result);r.onerror=no})}
async function saveAud(f,k="adzan"){try{const db=await idb();db.transaction("f","readwrite").objectStore("f").put(f,k)}catch(e){}}
function setImg(k,u){if(k==="bg")document.body.style.backgroundImage=`linear-gradient(#06402baa,#032a1bf0),url(${u})`;else{$("logo").src=u;$("logo").style.display="block"}}
async function loadImg(){try{const db=await idb();for(const k of["bg","logo"]){const r=db.transaction("f").objectStore("f").get(k);r.onsuccess=()=>{if(r.result)setImg(k,URL.createObjectURL(r.result))}}}catch(e){}}
async function loadAud(){try{const db=await idb();const r=db.transaction("f").objectStore("f").get("adzan");r.onsuccess=()=>{if(r.result){customURL=URL.createObjectURL(r.result);A.src=customURL}}}catch(e){}}
function unlock(){
  if(unlocked)return;unlocked=true;$("unlock").style.display="none";
  try{ctx=new (window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}
  if(customURL){A.muted=true;A.play().then(()=>{A.pause();A.currentTime=0;A.muted=false}).catch(()=>{A.muted=false})}
}
["click","keydown","touchstart"].forEach(ev=>addEventListener(ev,unlock,{once:false}));
function beep(){ // cadangan jika belum ada file adzan
  if(!ctx)return;[0,.9,1.8].forEach(s=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=660;o.connect(g);g.connect(ctx.destination);
  const t=ctx.currentTime+s;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+.8);o.start(t);o.stop(t+.85)});
}
function stopAdzan(){A.pause();A.currentTime=0;A.onended=null;$("adz").classList.remove("show")}
function adzan(name){
  $("adzN").textContent=name;$("adz").classList.add("show");
  const done=()=>setTimeout(()=>$("adz").classList.remove("show"),15000);
  if(customURL){A.currentTime=0;A.play().catch(()=>{});A.onended=done}
  else{beep();setTimeout(()=>$("adz").classList.remove("show"),8000)}
}

/* ---- slide informasi ---- */
let slides=[],si=0;
async function getInfo(){try{const db=await idb();return await new Promise(ok=>{const r=db.transaction("f").objectStore("f").get("info");r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>ok([])})}catch(e){return[]}}
async function setInfo(a){try{const db=await idb();db.transaction("f","readwrite").objectStore("f").put(a,"info")}catch(e){}}
function showSlide(){const has=slides.length>0;$("slide").style.display=has?"block":"none";$("empty").style.display=has?"none":"block";if(has)$("slide").src=slides[si%slides.length]}
async function loadInfo(){const a=await getInfo();slides=a.map(b=>URL.createObjectURL(b));si=0;showSlide()}
setInterval(()=>{if(slides.length>1){si=(si+1)%slides.length;showSlide()}},10000);
/* ---- tampilan ---- */
let times=null,day=-1,fired={};
const p2=n=>String(n).padStart(2,"0"),hm=d=>p2(d.getHours())+":"+p2(d.getMinutes());
function render(){
  $("place").textContent=cfg.name;$("tick").textContent=cfg.txt;
  $("cards").innerHTML=SHOW.map(([k,n])=>`<div class="c" id="c_${k}"><b>${n}</b><span>${hm(times[k])}</span></div>`).join("");
}
function tick(){
  const now=new Date();
  if(now.getDate()!==day){day=now.getDate();times=calc(now);fired={};render()}
  $("clock").textContent=p2(now.getHours())+":"+p2(now.getMinutes())+":"+p2(now.getSeconds());
  let dt="";try{dt=now.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+" · "+now.toLocaleDateString("id-ID-u-ca-islamic",{day:"numeric",month:"long",year:"numeric"})}catch(e){}
  $("date").textContent=dt;
  let nxt=null;
  for(const[k,n]of NAMES){
    const t=times[k];
    if(!nxt&&t>now)nxt=[k,n,t];
    if(Math.floor(t/6e4)===Math.floor(now/6e4)&&!fired[k]){fired[k]=1;adzan(n)}
  }
  NAMES.forEach(([k])=>$("c_"+k)&&$("c_"+k).classList.toggle("on",!!nxt&&nxt[0]===k));
  if(nxt){const s=Math.floor((nxt[2]-now)/1000);$("next").textContent=`${nxt[1]} dalam ${p2(Math.floor(s/3600))}:${p2(Math.floor(s%3600/60))}:${p2(s%60)}`}
  else $("next").textContent="Subuh besok pagi";
}

/* ---- pengaturan ---- */
function openSet(){$("sName").value=cfg.name;$("sLat").value=cfg.lat;$("sLng").value=cfg.lng;$("sTxt").value=cfg.txt;$("sOff").value=["fajr","sunrise","dhuhr","asr","maghrib","isha"].map(k=>cfg.off[k]).join(",");$("set").classList.add("show")}
$("gear").onclick=openSet;
addEventListener("keydown",e=>{if(e.key==="s"&&!$("set").classList.contains("show"))openSet();if(e.key==="Escape"){stopAdzan();$("set").classList.remove("show")}});
$("sSave").onclick=async()=>{
  const o=$("sOff").value.split(",").map(Number);const K=["fajr","sunrise","dhuhr","asr","maghrib","isha"];
  cfg={name:$("sName").value,lat:+$("sLat").value,lng:+$("sLng").value,txt:$("sTxt").value,off:Object.fromEntries(K.map((k,i)=>[k,isNaN(o[i])?0:o[i]]))};
  try{localStorage.setItem("tvcfg",JSON.stringify(cfg))}catch(e){}
  const f=$("sAud").files[0];if(f){await saveAud(f);customURL=URL.createObjectURL(f);A.src=customURL}
  for(const[k,id]of[["bg","sBg"],["logo","sLogo"]]){const g=$(id).files[0];if(g){await saveAud(g,k);setImg(k,URL.createObjectURL(g))}}
  const fi=[...$("sInfo").files];if(fi.length){const old=await getInfo();await setInfo(old.concat(fi));await loadInfo();$("sInfo").value=""}
  day=-1;$("set").classList.remove("show");
};
$("sTest").onclick=()=>{unlock();adzan("Tes Adzan")};
$("sClr").onclick=async()=>{await setInfo([]);await loadInfo()};
loadAud();loadImg();loadInfo();tick();setInterval(tick,1000);
</script>
</body>
</html>
